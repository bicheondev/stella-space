name: Space collector
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
# Runs intentionally overlap so the next runner starts before this one stops.
# Collection ownership and rate budgets are coordinated in the shared database.
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/heartbeat.mjs
        env:
          SITE_URL: https://stellive-space.vercel.app
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          GH_HANDOFF_TOKEN: ${{ github.token }}
