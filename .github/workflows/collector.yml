name: Space collector
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
# Legacy rollback only. Production collection is owned by Cloudflare.
# Re-enable manually only after stopping Cloudflare and removing the Vercel origin.
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/heartbeat.mjs
        env:
          SITE_URL: https://spacelive.vercel.app
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          GH_HANDOFF_TOKEN: ${{ github.token }}
