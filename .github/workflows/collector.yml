name: Space collector
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: space-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/heartbeat.mjs
        env:
          SITE_URL: https://stellive-space.vercel.app
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
